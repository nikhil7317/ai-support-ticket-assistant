spring.application.name=ai-support-ticket-assistant
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/ai_support_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# Gemini API configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.8-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
